[package]
name = "concolity"
version = "0.1.0"
edition = "2021"
description = "A concolic tracer for EVM bytecode: run it for real in revm, solve for the branch you missed"
license = "MIT"
repository = "https://github.com/formalmind/concolity"
readme = "README.md"
keywords = ["evm", "concolic", "symbolic-execution", "fuzzing", "solidity"]
categories = ["development-tools::testing", "cryptography::cryptocurrencies"]

[dependencies]
anyhow = "1"
revm = { version = "43", default-features = false, features = ["std"] }
