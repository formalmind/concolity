[package]
name = "concolity"
version = "0.1.0"
edition = "2021"
description = "A concolic tracer for EVM bytecode: run it for real in revm, solve for the branch you missed"
license = "MIT"
repository = "https://github.com/formalmind/concolity"
readme = "README.md"
keywords = ["evm", "concolic", "symbolic-execution", "fuzzing", "solidity"]
categories = ["development-tools::testing", "cryptography::cryptocurrencies"]

[dependencies]
anyhow = "1"
revm = { version = "43", default-features = false, features = ["std"] }
alloy-dyn-abi = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"
# The Foundry test runner, cheatcodes and source maps: a crate of this repository since formalmind dropped its
# debugger (nothing else used it). formal-ast (solc's AST, foundry.toml, the project's remappings) stays in formalmind.
sol-debug = { path = "crates/sol-debug", default-features = false }
formal-ast = { git = "https://github.com/formalmind/formalmind", branch = "main" }

[workspace]
members = ["crates/sol-debug"]

[[bin]]
name = "concolity"
path = "src/main.rs"
