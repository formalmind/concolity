[package]
name = "concolity"
version = "0.1.0"
edition = "2021"
description = "A concolic tracer for EVM bytecode: run it for real in revm, solve for the branch you missed"
license = "MIT"
repository = "https://github.com/formalmind/concolity"
readme = "README.md"
keywords = ["evm", "concolic", "symbolic-execution", "fuzzing", "solidity"]
categories = ["development-tools::testing", "cryptography::cryptocurrencies"]

[dependencies]
anyhow = "1"
revm = { version = "43", default-features = false, features = ["std"] }
alloy-dyn-abi = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"
# The Foundry test runner, cheatcodes and source maps. Until sol-debug's coverage mode is on crates.io, from the
# formalmind branch that adds it (a local checkout can override it in .cargo/config.toml, which git ignores).
sol-debug = { git = "https://github.com/formalmind/formalmind", branch = "claude/concolic-tracer-exploration-41fa9c" }
formal-ast = { git = "https://github.com/formalmind/formalmind", branch = "claude/concolic-tracer-exploration-41fa9c" }

[[bin]]
name = "concolity"
path = "src/main.rs"
