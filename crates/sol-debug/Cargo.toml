[package]
name = "sol-debug"
version = "0.1.0"
edition = "2021"
description = "A local Solidity debugger: solc source maps to every opcode, revm to run it, storage decoded by the storage layout"
license = "MIT"
repository = "https://github.com/formalmind/concolity"
homepage = "https://formal.team"
readme = "README.md"
keywords = ["solidity", "debugger", "evm", "revm", "tui"]
categories = ["development-tools::debugging", "command-line-utilities"]

[dependencies]
alloy-dyn-abi = { version = "1", features = ["eip712"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
k256 = { version = "0.14", features = ["ecdsa"] }
formal-ast = { git = "https://github.com/formalmind/formalmind", branch = "main" }
ratatui = { version = "0.30", optional = true }
revm = { version = "43", default-features = false, features = ["std"] }
opaline = { version = "0.4.1", default-features = false, features = ["builtin-themes"], optional = true }
serde_json = { version = "1", features = ["arbitrary_precision", "preserve_order"] }
toml = "1.1"
tree-sitter-highlight = { version = "0.25", optional = true }
tree-sitter-solidity = { version = "1.2.13", optional = true }
ureq = "3"

# The terminal UI (and its highlighter) is a feature, so a program that only runs tests (concolity, a language server)
# builds the runner, the cheatcodes and the source maps without ratatui or tree-sitter.
[features]
default = ["tui"]
tui = ["dep:ratatui", "dep:opaline", "dep:tree-sitter-highlight", "dep:tree-sitter-solidity"]

[[bin]]
name = "sol-debug"
path = "src/main.rs"
required-features = ["tui"]

[lib]
path = "src/lib.rs"

[[example]]
name = "tui_snapshot"
required-features = ["tui"]

[[example]]
name = "split_snapshot"
required-features = ["tui"]
